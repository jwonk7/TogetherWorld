<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F4C7">
<title>Together World · 어린이대공원</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Jua&family=Nunito:wght@600;700;800&family=Noto+Sans+KR:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/nanumsquareround.min.css">
<style>
:root{
  --primary:#009A8E;--primary-bright:#14BBAE;--primary-deep:#008276;
  --secondary:#F2B807;--tertiary:#F798A6;
  --bg:#F8F4C7;--surface:#FFFAE5;--surface-dim:#F3EBD3;--slot:#EDE0CD;
  --outline:#E2D3B3;--outline-strong:#9A8662;
  --text:#6B5842;--strong:#5B4A3A;--muted:#786750;
  --pattern:#EFE7AE;--bell:#918433;--menu:#FEED9F;--menu-hi:#FDDB5C;
  --nt-blue:#3E6BB8;--nt-pink:#C44669;--danger:#D8504F;
  --shadow:0 4px 0 rgba(107,88,66,.12);--shadow-lg:0 8px 0 rgba(107,88,66,.10);
  --f-title:Fredoka,Jua,sans-serif;
  --f-body:Nunito,NanumSquareRound,'Noto Sans KR',sans-serif;
  --f-btn:Fredoka,NanumSquareRound,'Noto Sans KR',sans-serif;
  --blob:28px 34px 30px 26px / 30px 28px 34px 30px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background-color:var(--bg);
  background-image:radial-gradient(var(--pattern) 4px,transparent 4.5px),radial-gradient(var(--pattern) 4px,transparent 4.5px);
  background-size:64px 64px;background-position:0 0,32px 32px;
  font-family:var(--f-body);font-weight:600;font-size:16px;line-height:1.5;color:var(--text);
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--primary-bright);outline-offset:2px}
#app{position:relative;max-width:480px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overflow:clip}

/* app bar */
#bar{height:56px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 16px;margin-top:8px}
.icon-btn{width:44px;height:44px;flex-shrink:0;border:0;padding:0;border-radius:9999px;background:var(--surface);color:var(--strong);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 80ms}
.icon-btn:active{transform:scale(.96)}
#title{flex:1;min-width:0;font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.3;color:var(--strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title small{display:block;font-family:var(--f-body);font-size:12px;font-weight:800;line-height:1.2;color:var(--muted)}
.seg{display:flex;flex-shrink:0;background:var(--secondary);border-radius:9999px;padding:4px;height:44px}
.seg button{border:0;background:none;border-radius:9999px;min-width:44px;padding:0 10px;font-size:14px;font-weight:800;line-height:1.2;color:var(--strong);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 2px 0 rgba(107,88,66,.15)}

/* tools: search + chips */
#tools{flex-shrink:0;padding:8px 16px 0;position:relative;z-index:6}
.search{position:relative}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{width:100%;height:52px;border:2px solid var(--outline-strong);border-radius:9999px;background:var(--surface);padding:0 20px 0 50px;font:600 16px/1.5 var(--f-body);color:var(--strong)}
.search input::placeholder{color:var(--muted);opacity:1}
.search input:focus{outline:none;border:3px solid var(--primary-bright);padding-left:49px}
#results{position:absolute;left:16px;right:16px;top:66px;background:var(--menu);border-radius:24px;box-shadow:var(--shadow-lg);padding:8px;display:none;max-height:300px;overflow:auto}
#results.open{display:block}
#results button{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;border:0;background:none;border-radius:9999px;padding:6px 14px;text-align:left;font-size:16px;font-weight:700;color:var(--strong);cursor:pointer}
#results button:hover,#results button:focus-visible{background:var(--menu-hi)}
#results .empty{padding:12px 14px;font-size:14px;font-weight:700;color:var(--strong)}
.dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;border:2px solid var(--surface)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;height:40px;border:0;border-radius:9999px;background:var(--surface-dim);color:var(--strong);padding:0 16px;font-size:14px;font-weight:800;line-height:1.2;cursor:pointer;display:flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--primary-deep);color:#fff}
.chip .dot{border-color:var(--surface)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}

/* map */
#v-map{padding:8px 12px 14px}
#mapbox{position:relative;width:100%;height:100%;background:var(--surface);border-radius:var(--blob);box-shadow:var(--shadow);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#mapbox.drag{cursor:grabbing}
#canvas{position:absolute;left:0;top:0;width:0;height:0}
#canvas > svg{position:absolute;left:0;top:0;width:calc(1078px * var(--s,1));height:calc(660px * var(--s,1));display:block}
.pin{position:absolute;left:calc(var(--x) * var(--s,1) * 1px);top:calc(var(--y) * var(--s,1) * 1px);width:44px;height:44px;margin:-22px 0 0 -22px;border:0;padding:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transform:scale(var(--inv,1))}
.pin.off{display:none}
.pin-dot{width:28px;height:28px;border-radius:50%;background:var(--c,#fff);border:2px solid var(--surface);box-shadow:0 2px 0 rgba(107,88,66,.28);display:flex;align-items:center;justify-content:center;color:var(--strong);transition:transform 120ms}
.pin-label{position:absolute;top:38px;left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--surface);color:var(--strong);font-size:12px;font-weight:700;line-height:1.35;padding:1px 8px;border-radius:9999px;display:none;pointer-events:none;box-shadow:0 2px 0 rgba(107,88,66,.12)}
#canvas.labels .pin-label{display:block}
.pin.sel{z-index:5}
.pin.sel .pin-dot{transform:scale(1.25);box-shadow:0 0 0 3px var(--primary-bright),0 2px 0 rgba(107,88,66,.28)}
.pin.sel .pin-label{display:block;top:42px;background:var(--primary-deep);color:#fff;font-size:14px;font-weight:800;padding:3px 12px}
.pin.hp{z-index:4}
.pin.hp .pin-dot{width:36px;height:36px;background:var(--primary-deep);color:#fff;font:700 22px/1 var(--f-title);border-width:3px}
.pin.hp .pin-dot::after{content:"";position:absolute;width:36px;height:36px;border-radius:50%;border:3px solid var(--primary-bright);animation:pulse 1.6s ease-out infinite}
.pin.hp.done .pin-dot{background:var(--menu);color:var(--primary-deep)}
.pin.hp.done .pin-dot::after{display:none}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.map-ctl{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:3}
#pill{position:absolute;left:12px;bottom:14px;z-index:3;height:44px;border:0;border-radius:9999px;background:var(--bell);color:#fff;padding:0 18px 0 14px;display:flex;align-items:center;gap:8px;font-family:Nunito,sans-serif;font-weight:800;font-size:22px;line-height:1;box-shadow:var(--shadow);cursor:pointer}
#credit{position:absolute;left:0;right:0;top:8px;text-align:center;font-size:12px;font-weight:700;line-height:1.35;color:var(--muted);pointer-events:none;z-index:2;padding:0 60px}

/* list */
#v-list{overflow-y:auto;padding:8px 20px 40px}
.group-h{font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.3;color:var(--strong);margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.group-h .n{font-family:Nunito,sans-serif;font-size:14px;font-weight:800;color:var(--muted)}
.li{display:flex;align-items:center;gap:12px;width:100%;min-height:72px;border:0;background:var(--surface);border-radius:18px;padding:12px 16px;margin-bottom:8px;text-align:left;box-shadow:var(--shadow);cursor:pointer}
.li:active{transform:scale(.99)}
.slot{width:44px;height:44px;flex-shrink:0;border-radius:50%;background:var(--c,var(--slot));display:flex;align-items:center;justify-content:center;color:var(--strong)}
.li .tx{flex:1;min-width:0}
.li .nm{font-size:16px;font-weight:800;line-height:1.35;color:var(--strong)}
.li .sub{font-size:14px;font-weight:600;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.li .chev{color:var(--outline-strong);flex-shrink:0}
.badge{display:inline-block;background:var(--danger);color:#fff;font-size:12px;font-weight:800;line-height:1.35;padding:1px 8px;border-radius:9999px;vertical-align:middle;margin-left:6px}
.empty-state{text-align:center;padding:40px 20px;font-size:16px;font-weight:700;color:var(--text)}

/* stamps */
#v-stamps{overflow-y:auto;padding:10px 20px 28px;display:none;flex-direction:column}
#v-stamps.on{display:flex}
.leaflet{background:var(--surface);border-radius:var(--blob);box-shadow:var(--shadow);overflow:hidden;flex-shrink:0}
.lf-head{padding:16px 20px 10px;display:flex;align-items:center;justify-content:space-between}
.lf-head h2{margin:0;font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.3;color:var(--strong)}
.lf-head p{margin:3px 0 0;font-size:12px;font-weight:700;line-height:1.35;color:var(--muted)}
.count{font-family:Nunito,sans-serif;font-weight:800;color:var(--strong);font-size:22px;line-height:1}
.count span{font-size:14px;color:var(--muted)}
.track{margin:0 20px 14px;height:12px;border-radius:9999px;background:var(--slot);overflow:hidden}
.track i{display:block;height:12px;border-radius:9999px;background:var(--primary-deep);transition:width 500ms ease-out}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:2px dashed var(--outline)}
.cell{position:relative;padding:22px 8px 14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.cell:nth-child(odd){border-right:2px dashed var(--outline)}
.cell:nth-child(-n+2){border-bottom:2px dashed var(--outline)}
.cell:nth-child(2),.cell:nth-child(3){background:#FBF5DC}
.ring{position:relative;width:104px;height:104px}
.disc{width:104px;height:104px;border-radius:50%;background:var(--slot);border:2.5px dashed var(--outline-strong);display:flex;align-items:center;justify-content:center;color:#807B74}
.cell.done .disc{background:var(--menu);border:3px solid var(--primary-bright);--kb:#FEED9F;color:var(--primary-deep)}
button.cell{border:0;border-radius:0;margin:0;background:none;font:inherit;cursor:pointer;width:100%;-webkit-appearance:none;appearance:none}
button.cell:nth-child(2),button.cell:nth-child(3){background:#FBF5DC}
button.cell:active .disc{transform:scale(.96)}
.steps{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--surface-dim);border-radius:18px;padding:10px 14px;font-size:14px;font-weight:700;line-height:1.45;color:var(--strong)}
.steps b{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--primary-deep);color:#fff;font:800 14px/24px Nunito,sans-serif;text-align:center}
.steps svg{flex-shrink:0;color:var(--muted);margin-top:1px}
.dlg h3{margin:0 0 4px;font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.3;color:var(--strong)}
.dlg .tipnote{margin:12px 2px 0;font-size:12px;font-weight:700;line-height:1.35;color:var(--muted)}
#dialog{max-height:92%;overflow-y:auto;overflow-x:hidden;padding:18px 0 12px;scrollbar-width:none}
#dialog::-webkit-scrollbar{display:none}
.tip{position:absolute;top:-12px;left:50%;transform:translateX(-50%) rotate(-4deg);white-space:nowrap;background:var(--primary-deep);color:#fff;font-size:14px;font-weight:800;line-height:1.2;padding:4px 14px;border-radius:9999px}
.cap{display:flex;align-items:center;gap:6px}
.cap .no{font-family:Nunito,sans-serif;font-size:12px;font-weight:800;line-height:1;color:var(--muted);background:var(--surface-dim);border-radius:9999px;padding:4px 8px}
.cell.done .cap .no{background:var(--primary-deep);color:#fff}
.cap .nm{font-size:14px;font-weight:800;line-height:1.2;color:var(--muted);text-align:center}
.cell.done .cap .nm,.cell.next .cap .nm{color:var(--strong)}
.ink{position:absolute;right:-16px;bottom:-10px;width:68px;height:68px;border-radius:50%;background:var(--surface);border:3px solid var(--nt-pink);padding:3px;transform:rotate(-10deg)}
.ink b{width:100%;height:100%;border-radius:50%;border:1.5px dashed var(--nt-pink);display:flex;align-items:center;justify-content:center;font-family:Jua,Fredoka,sans-serif;font-weight:400;font-size:20px;line-height:1;color:var(--nt-pink)}
html[lang="en"] .ink b{font-family:Fredoka,sans-serif;font-weight:700;font-size:17px}
.cell.pop .disc{animation:inkIn 500ms ease-out 200ms both}
.cell.pop .ink{animation:stampIn 520ms cubic-bezier(.2,.8,.3,1.2) 550ms both}
@keyframes stampIn{0%{transform:rotate(-10deg) scale(2.4);opacity:0}55%{transform:rotate(-10deg) scale(.88);opacity:1}78%{transform:rotate(-10deg) scale(1.06)}100%{transform:rotate(-10deg) scale(1);opacity:1}}
@keyframes inkIn{0%{filter:grayscale(1)}100%{filter:grayscale(0)}}
.lf-foot{padding:11px 16px;background:var(--surface-dim);display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:700;line-height:1.35;color:var(--muted);text-align:center}
.bubble{position:relative;margin-top:28px;background:var(--surface);border-radius:30px 34px 28px 32px / 32px 28px 34px 30px;box-shadow:var(--shadow);padding:26px 20px 18px;display:flex;align-items:center;gap:12px;flex-shrink:0}
.nametag{position:absolute;top:-14px;left:18px;transform:rotate(-5deg);background:var(--nt-blue);color:#fff;font-size:14px;font-weight:800;line-height:1.2;padding:5px 18px;border-radius:9999px}
.avatar{width:52px;height:52px;flex-shrink:0;border-radius:50%;background:var(--menu);display:flex;align-items:center;justify-content:center}
.say{flex:1;font-size:18px;font-weight:700;line-height:1.55;color:var(--text)}
.bob{position:absolute;right:22px;bottom:10px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
.spacer{flex:1;min-height:20px}
.btn{width:100%;min-height:56px;border:0;border-radius:9999px;padding:8px 32px;font-family:var(--f-btn);font-weight:800;font-size:20px;line-height:1.1;cursor:pointer;box-shadow:var(--shadow);transition:transform 80ms;flex-shrink:0}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--primary);color:#fff}
.btn.primary:active{background:var(--primary-deep)}
.btn.secondary{background:var(--surface);color:var(--strong)}
.linkbtn{margin:12px auto 0;border:0;background:none;min-height:44px;padding:0 16px;font-size:14px;font-weight:800;color:var(--primary-deep);text-decoration:underline;text-underline-offset:3px;cursor:pointer;flex-shrink:0}

/* overlays */
#scrim{position:absolute;inset:0;z-index:20;display:none}
#scrim.on{display:block}
#scrim.dim{background:rgba(91,74,58,.35)}
#menu{position:absolute;left:16px;top:66px;z-index:21;width:230px;background:var(--menu);border-radius:28px;box-shadow:var(--shadow-lg);padding:10px;display:none;transform-origin:20px 0}
#menu::before{content:"";position:absolute;left:16px;top:-9px;border:10px solid transparent;border-bottom-color:var(--menu);border-top:0}
#menu.on{display:block;animation:popIn 220ms cubic-bezier(.2,.9,.3,1.3)}
#menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;border:0;background:none;border-radius:9999px;padding:6px 14px;font-size:16px;font-weight:800;color:var(--strong);text-align:left;cursor:pointer}
#menu button[aria-current="page"],#menu button:hover{background:var(--menu-hi)}
#menu hr{border:0;border-top:2px dashed #E9CF6B;margin:6px 10px}
#menu button.sm{font-size:14px;font-weight:700;color:var(--text)}
@keyframes popIn{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-radius:32px 32px 0 0;box-shadow:0 -4px 0 rgba(107,88,66,.10);padding:12px 20px 28px;transform:translateY(105%);visibility:hidden;transition:transform 240ms cubic-bezier(.2,.9,.3,1.1),visibility 0s 240ms;max-height:62%;overflow-y:auto}
#sheet.on{transform:translateY(0);visibility:visible;transition:transform 240ms cubic-bezier(.2,.9,.3,1.1)}
#sheet .grab{width:40px;height:5px;border-radius:9999px;background:var(--outline);margin:0 auto 14px}
#sheet .x{position:absolute;right:14px;top:14px;width:40px;height:40px;border:0;border-radius:50%;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sh-head{display:flex;align-items:center;gap:12px;padding-right:44px}
.sh-head h3{margin:0;font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.3;color:var(--strong)}
.sh-cat{font-size:14px;font-weight:800;line-height:1.2;color:var(--muted)}
.sh-desc{margin:14px 0 0;font-size:16px;font-weight:600;line-height:1.5;color:var(--text)}
.rows{margin:14px 0 0;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--surface-dim);border-radius:18px;padding:10px 14px;font-size:14px;font-weight:700;line-height:1.45;color:var(--strong)}
.row svg{flex-shrink:0;margin-top:1px;color:var(--muted)}
.row.warn{background:#FBE3DF}
#dialog{position:absolute;left:20px;right:20px;top:50%;z-index:22;transform:translateY(-50%);display:none}
#dialog.on{display:block}
.dlg{position:relative;background:var(--surface);border-radius:32px;box-shadow:var(--shadow-lg);padding:28px 24px 24px;animation:popIn 220ms cubic-bezier(.2,.9,.3,1.3)}
.dlg .say{font-size:18px}
.dlg label{display:block;margin:16px 0 6px;font-size:14px;font-weight:800;line-height:1.2;color:var(--strong)}
.dlg input{width:100%;height:56px;border:2px solid var(--outline-strong);border-radius:9999px;background:var(--surface);text-align:center;font:800 26px/1 Nunito,sans-serif;letter-spacing:10px;color:var(--strong)}
.dlg input:focus{outline:none;border:3px solid var(--primary-bright)}
.dlg .acts{display:flex;gap:10px;margin-top:18px}
.dlg .acts .btn{flex:1 1 0;width:auto;min-width:0;padding:8px 10px;font-size:18px}
.dlg{overflow-wrap:anywhere}
#confetti{position:absolute;inset:0;z-index:23;pointer-events:none;overflow:hidden;display:none}
#confetti.on{display:block}
#confetti i{position:absolute;top:-24px;width:10px;height:16px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(105vh) rotate(720deg)}}
.party{text-align:center}
.party h3{font-size:28px;line-height:1.2;margin:6px 0 4px}
.party .sub{font-size:14px;font-weight:800;color:var(--muted)}
.party .row4{display:flex;justify-content:center;gap:8px;margin:18px 0 6px}
.party .mini{width:56px;height:56px;flex-shrink:1;min-width:0;border-radius:50%;background:var(--menu);border:3px solid var(--primary-bright);display:flex;align-items:center;justify-content:center;color:var(--primary-deep);--kb:#FEED9F;animation:popIn 320ms cubic-bezier(.2,.9,.3,1.3) both}
.party .mini svg{width:40px;height:40px}
.party .say{font-size:16px;margin-top:10px}
#gate{position:absolute;left:0;right:0;top:64px;bottom:0;z-index:19;display:none;overflow-y:auto;padding:26px 20px 28px;background-color:var(--bg);background-image:radial-gradient(var(--pattern) 4px,transparent 4.5px),radial-gradient(var(--pattern) 4px,transparent 4.5px);background-size:64px 64px;background-position:0 0,32px 32px}
#gate.on{display:block}
.gcard{position:relative;max-width:420px;margin:0 auto;background:var(--surface);border-radius:32px;box-shadow:var(--shadow-lg);padding:30px 22px 22px;animation:popIn 220ms cubic-bezier(.2,.9,.3,1.3)}
.gcard .hero{display:flex;justify-content:center;margin:2px 0 12px}
.gcard .hero .avatar{width:84px;height:84px}
.gcard .hero .avatar svg{width:66px;height:66px}
.gcard h2{margin:0;text-align:center;word-break:keep-all;font-family:var(--f-title);font-weight:600;font-size:22px;line-height:1.25;color:var(--strong)}
.gcard .say{word-break:keep-all;text-align:center;font-size:16px;margin-top:8px}
.gcard .stack{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.gcard label{display:block;margin:14px 0 6px;font-size:14px;font-weight:800;line-height:1.2;color:var(--strong)}
.gcard input{width:100%;height:52px;border:2px solid var(--outline-strong);border-radius:9999px;background:var(--surface);padding:0 20px;font:600 16px/1.5 var(--f-body);color:var(--strong)}
.gcard input::placeholder{color:var(--muted);opacity:1}
.gcard input:focus{outline:none;border:3px solid var(--primary-bright);padding:0 19px}
.gnote{margin:12px 2px 0;text-align:center;font-size:12px;font-weight:700;line-height:1.35;color:var(--muted)}
.gerr{margin:12px 0 0;background:#FBE3DF;color:var(--strong);border-radius:18px;padding:10px 14px;font-size:14px;font-weight:700;line-height:1.45;display:none}
.gerr.on{display:block}
.gate-on #menuBtn{visibility:hidden}
.acct{display:flex;align-items:center;gap:10px;padding:6px 14px 10px;font-size:14px;font-weight:800;color:var(--strong)}
.acct small{font-size:12px;font-weight:700;color:var(--muted);display:block;line-height:1.35}
.card2{background:var(--surface);border-radius:var(--blob);box-shadow:var(--shadow);padding:18px 18px 16px;margin-top:16px;flex-shrink:0}
.card2 h2{margin:0;font-family:var(--f-title);font-weight:600;font-size:20px;line-height:1.3;color:var(--strong)}
.card2 .sub2{font-size:12px;font-weight:700;line-height:1.35;color:var(--muted);margin-top:2px}
.card2 .road{display:block;width:100%;height:auto;margin-top:8px}
.mg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:12px}
.mc{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;background:var(--surface-dim);border-radius:18px;text-align:center}
.mc .r{width:64px;height:64px;border-radius:50%;border:2.5px dashed var(--outline-strong);display:flex;align-items:center;justify-content:center;color:#807B74;--kb:#F3EBD3}
.mc .r svg{width:40px;height:40px}
.mc.got .r{border:3px solid var(--primary-bright);background:var(--menu);color:var(--primary-deep);--kb:#FEED9F}
.mc .n1{font-size:12px;font-weight:800;line-height:1.25;color:var(--strong)}
.mc .n2{font-size:12px;font-weight:700;line-height:1.25;color:var(--muted)}
.card2 .how{display:flex;gap:8px;align-items:flex-start;margin-top:12px;background:var(--surface-dim);border-radius:18px;padding:10px 14px;font-size:12px;font-weight:700;line-height:1.35;color:var(--muted)}
.card2 .how svg{flex-shrink:0}
.card2 .btn{margin-top:14px;font-size:18px}
#toast{position:absolute;left:20px;right:20px;top:14px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--menu);color:var(--strong);font-size:14px;font-weight:700;line-height:1.45;border-radius:24px;padding:12px 18px;box-shadow:var(--shadow-lg);display:none;align-items:center;gap:8px;max-width:100%}
#toast div.on{display:flex;animation:popIn 220ms cubic-bezier(.2,.9,.3,1.3)}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}

// The station opens the tag for 30 s after a clear, so arriving with a valid game id is the proof of clearing.
function readToken() {
  var q = window.location.search || '', h = window.location.hash || '', a;
  a = /^#stamp-([a-z]+)/.exec(h);
  if (a) return { game: a[1] };
  a = /[?&](?:g|stamp)=([a-z]+)/.exec(q);
  if (a) return { game: a[1] };
  return null;
}

/* ---------- views / routing ---------- */
function setView(v, fromRoute) {
  if (VIEWS.indexOf(v) < 0) v = 'map';
  view = v;
  VIEWS.forEach(function (k) { $('v-' + k).classList.toggle('on', k === v); });
  $('tools').style.display = v === 'stamps' ? 'none' : '';
  if (v !== 'map') { $('sheet').classList.remove('on'); sel = null; }
  renderBar(); renderResults();
  if (v === 'map') { layoutMap(); markSel(); }
  if (v === 'list') renderList();
  if (v === 'stamps') renderStamps();
  if (!fromRoute) { try { if (window.location.hash !== '#' + v) window.location.hash = v; } catch (e) {} }
}
function route() {
  var tk = readToken();
  if (tk) {
    try { window.history.replaceState(null, '', window.location.pathname.replace(/stamp\/?$/, '') + '#stamps'); } catch (e) {}
    grant(tk.game);
    return;
  }
  var h = (window.location.hash || '').slice(1);
  if (VIEWS.indexOf(h) >= 0 && h !== view) setView(h, true);
}
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  var d = stamps.date; stamps = loadStamps();
  if (stamps.date !== d) renderAll();
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeOverlays(); closeSheet(); } });
$('lang').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  lang = b.getAttribute('data-lang') === 'en' ? 'en' : 'ko'; sset('tw.lang', lang);
  var keep = sel; renderAll(); if (keep && view === 'map') openSheet(keep);
  if (gateStep) openGate(gateStep);
});
function renderAll() {
  renderBar(); renderChips(); renderMap(); renderResults();
  if (view === 'list') renderList();
  if (view === 'stamps') renderStamps();
}

/* ---------- start ---------- */
renderAll();
var h0 = (window.location.hash || '').slice(1);
setView(VIEWS.indexOf(h0) >= 0 ? h0 : 'map', true);
route();
if (!session && !gateStep) openGate('welcome');
window.__tw = { grant: grant, state: function () { return { view: view, lang: lang, stamps: stamps, s: s, session: session, rec: rec, online: ONLINE }; } };
})();
</script>
